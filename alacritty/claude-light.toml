# Claude Light Terminal Theme for Alacritty
# Inspired by Anthropic's Claude visual identity
# https://github.com/marceloduarte/claude-terminal-theme

[colors.primary]
background = "#faf9f5"
foreground = "#2a2a28"

[colors.cursor]
cursor = "#d97757"
text = "#faf9f5"

[colors.selection]
background = "#e8e6dc"
text = "#141413"

[colors.normal]
black = "#141413"
red = "#b8512e"
green = "#5e7245"
yellow = "#9e7a30"
blue = "#4a7ea8"
magenta = "#7a5c84"
cyan = "#4a8a78"
white = "#b0aea5"

[colors.bright]
black = "#b0aea5"
red = "#d97757"
green = "#788c5d"
yellow = "#b8944a"
blue = "#6a9bcc"
magenta = "#9b7ea4"
cyan = "#6aaa96"
white = "#141413"
