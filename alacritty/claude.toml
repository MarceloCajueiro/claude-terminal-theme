# Claude Terminal Theme for Alacritty
# Inspired by Anthropic's Claude visual identity
# https://github.com/marceloduarte/claude-terminal-theme

[colors.primary]
background = "#1a1815"
foreground = "#e8e6e3"

[colors.cursor]
cursor = "#d97757"
text = "#1a1815"

[colors.selection]
background = "#3e3328"
text = "#f4f3ee"

[colors.normal]
black = "#201d18"
red = "#c4564a"
green = "#788c5d"
yellow = "#c1944a"
blue = "#6a9bcc"
magenta = "#a87098"
cyan = "#5da3a0"
white = "#b0aea5"

[colors.bright]
black = "#605d56"
red = "#d97757"
green = "#96ad75"
yellow = "#d4ad5e"
blue = "#89b5de"
magenta = "#c08ab4"
cyan = "#7bbfbc"
white = "#f4f3ee"
